name: CI - Build, Push to ECR, Deploy to EKS

on:
  push:
    branches: [ main, Develop ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/kanban-backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/kanban-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/kanban-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/kanban-frontend:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Apply k8s manifests
        run: |
          kubectl apply -f k8s/

      - name: Set images to new tags (if deployments exist)
        run: |
          kubectl set image deployment/kanban-backend kanban-backend=${{ env.ECR_REGISTRY }}/kanban-backend:${{ github.sha }} --record || true
          kubectl set image deployment/kanban-frontend kanban-frontend=${{ env.ECR_REGISTRY }}/kanban-frontend:${{ github.sha }} --record || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/kanban-backend --timeout=120s || true
          kubectl rollout status deployment/kanban-frontend --timeout=120s || true

      - name: Post-deploy info
        run: |
          kubectl get deployments,svc -o wide

