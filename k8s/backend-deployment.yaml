apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-backend
  labels:
    app: kanban-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kanban-backend
  template:
    metadata:
      labels:
        app: kanban-backend
    spec:
      containers:
        - name: kanban-backend
          image: REPLACE_WITH_ECR/kanban-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: mongodb_uri
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20

