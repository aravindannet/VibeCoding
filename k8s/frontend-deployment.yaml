apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-frontend
  labels:
    app: kanban-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kanban-frontend
  template:
    metadata:
      labels:
        app: kanban-frontend
    spec:
      containers:
        - name: kanban-frontend
          image: REPLACE_WITH_ECR/kanban-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20

